<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliação de CSAS</title>
<link rel="stylesheet" href="../style.css">
<style>
.lk{margin:0 0 18px}
.lk .q{font-weight:600;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 0;font-weight:700;cursor:pointer}
.scale button.on{background:var(--acc2);border-color:var(--acc2);color:var(--acc-ink)}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut);margin-top:4px}
textarea{min-height:92px;resize:vertical}
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--acc2)}
.anon{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:14px}
.cnt{font-size:.78rem;color:var(--mut);text-align:right}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script src="../config.js"></script>
<script>
const C = window.F27_CONFIG;
const $app = document.getElementById('app');
const KEY = 'aval_csas_draft', DONE = 'aval_csas_done';
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const ITENS = [
  'Os objetivos da disciplina e os critérios de avaliação foram claros desde o início.',
  'As aulas eram bem organizadas e o conteúdo era explicado com clareza.',
  'As metodologias (seminários, Snatch Game, discussões) me ajudaram a aprender.',
  'O professor demonstra domínio do conteúdo e o relaciona com a prática em saúde.',
  'Eu me sentia à vontade para perguntar, discordar e participar.',
  'As avaliações foram coerentes com o que foi trabalhado em aula.',
  'Recebi retorno (feedback) útil sobre meu desempenho.',
  'O professor foi pontual, respeitoso e cumpriu o combinado.'
];
let st = {step:0, disc:{bom:'',pena:'',que_tal:'',levo:''}, doc:{continuar:'',mudar:'',conselho:''}, q:{}, busy:false, err:''};
try { const d = JSON.parse(store.get(KEY)||'null'); if (d) st = Object.assign(st, d, {step:0, busy:false, err:''}); } catch(e){}
const save = () => store.set(KEY, JSON.stringify({disc:st.disc, doc:st.doc, q:st.q}));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function steps(){ return `<div class="steps">${[0,1,2].map(i=>`<span class="${i<=st.step?'on':''}"></span>`).join('')}</div>`; }
function area(grp, k, label, hint){
  const v = st[grp][k];
  return `<label class="f">${label}</label><div class="mut small" style="margin:-2px 0 6px">${hint}</div>
  <textarea maxlength="1500" data-g="${grp}" data-k="${k}">${esc(v)}</textarea>`;
}
function render(){
  if (store.get(DONE) === '1' && st.step !== 9) { st.step = 9; }
  if (st.step === 9) {
    $app.innerHTML = `<div class="card center"><h2>Obrigado!</h2><p>Sua avaliação foi enviada de forma anônima.</p><p class="mut small">Ela será lida e usada para melhorar a disciplina. Pode fechar esta página.</p></div>`;
    return;
  }
  if (st.step === 0) {
    $app.innerHTML = `<div class="hd">CSAS · avaliação final</div>${steps()}
    <div class="anon"><b>100% anônima.</b> Não pedimos nome, e-mail nem login. Só 5 minutos. Seja concreto: exemplos ajudam mais que elogios gerais.</div>
    <div class="card"><h2>Parte 1 · A disciplina</h2>
      ${area('disc','bom','Que bom','O que funcionou e deve continuar?')}
      ${area('disc','pena','Que pena','O que faltou, atrapalhou ou poderia ter sido melhor?')}
      ${area('disc','que_tal','Que tal','O que você mudaria? Uma sugestão concreta.')}
      ${area('disc','levo','O que eu levo desta disciplina','Uma ideia, um conceito ou uma mudança no seu olhar.')}
    </div>
    <button class="btn full" id="next">Continuar</button>`;
  } else if (st.step === 1) {
    $app.innerHTML = `<div class="hd">CSAS · avaliação final</div>${steps()}
    <div class="card"><h2>Parte 2 · O professor</h2>
      <p class="mut small">Marque de 1 a 5 o quanto concorda com cada frase.</p>
      ${ITENS.map((t,i)=>{const n=i+1;return `<div class="lk"><div class="q">${n}. ${esc(t)}</div>
        <div class="scale">${[1,2,3,4,5].map(v=>`<button type="button" data-q="${n}" data-v="${v}" class="${st.q['q'+n]===v?'on':''}">${v}</button>`).join('')}</div>
        <div class="ends"><span>Discordo totalmente</span><span>Concordo totalmente</span></div></div>`}).join('')}
      ${area('doc','continuar','O que o professor deve continuar fazendo?','')}
      ${area('doc','mudar','O que deveria parar ou mudar?','')}
      ${area('doc','conselho','Um conselho para ele dar à próxima turma','')}
    </div>
    <div style="display:flex;gap:8px"><button class="btn sec" id="back">Voltar</button><button class="btn full" id="next">Revisar e enviar</button></div>`;
  } else {
    const nq = Object.keys(st.q).length;
    const nd = Object.values(st.disc).filter(x=>x.trim()).length;
    const nc = Object.values(st.doc).filter(x=>x.trim()).length;
    const vazio = !nq && !nd && !nc;
    $app.innerHTML = `<div class="hd">CSAS · avaliação final</div>${steps()}
    <div class="card"><h2>Pronto para enviar?</h2>
      <p>Disciplina: <b>${nd}</b> de 4 campos preenchidos.<br>Professor: <b>${nq}</b> de 8 notas e <b>${nc}</b> de 3 comentários.</p>
      <p class="mut small">Campos em branco são aceitos. Depois de enviar não é possível editar.</p>
      ${st.err?`<p class="err">${esc(st.err)}</p>`:''}
    </div>
    <div style="display:flex;gap:8px"><button class="btn sec" id="back">Voltar</button><button class="btn full" id="send" ${vazio||st.busy?'disabled':''}>${st.busy?'Enviando…':'Enviar avaliação'}</button></div>`;
  }
  bind();
}
function bind(){
  document.querySelectorAll('textarea').forEach(t => t.oninput = () => { st[t.dataset.g][t.dataset.k] = t.value; save(); });
  document.querySelectorAll('.scale button').forEach(b => b.onclick = () => {
    const k = 'q'+b.dataset.q, v = +b.dataset.v;
    if (st.q[k] === v) delete st.q[k]; else st.q[k] = v;
    save();
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', st.q[k] === +x.dataset.v));
  });
  const n = document.getElementById('next'); if (n) n.onclick = () => { st.step++; render(); window.scrollTo(0,0); };
  const b = document.getElementById('back'); if (b) b.onclick = () => { st.step--; st.err=''; render(); window.scrollTo(0,0); };
  const s = document.getElementById('send'); if (s) s.onclick = enviar;
}
async function enviar(){
  st.busy = true; st.err = ''; render();
  try {
    const r = await fetch(C.SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/rpc/aval_csas_enviar', {
      method:'POST',
      headers:{'Content-Type':'application/json', apikey:C.SUPABASE_KEY, Authorization:'Bearer '+C.SUPABASE_KEY},
      body: JSON.stringify({p_disc: st.disc, p_doc: Object.assign({}, st.q, st.doc)})
    });
    if (!r.ok) throw new Error('Erro ' + r.status);
    store.set(DONE,'1'); store.del(KEY); st.step = 9; render();
  } catch(e) {
    st.busy = false; st.err = 'Não foi possível enviar. Verifique a internet e tente de novo. Suas respostas foram mantidas.'; render();
  }
}
render();
</script>
</body></html>
