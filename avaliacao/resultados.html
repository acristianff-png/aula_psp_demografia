<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados · Avaliação de CSAS</title>
<link rel="stylesheet" href="../style.css">
<style>
.wide{max-width:980px}
.it{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dist{display:flex;gap:3px;height:16px;margin-top:6px}
.dist i{display:block;border-radius:3px;background:var(--acc2);opacity:.85}
.avg{font-family:"Fraunces",Georgia,serif;font-size:1.6rem;text-align:right}
.resp{border-left:3px solid var(--acc);background:var(--soft);padding:8px 10px;margin:6px 0;white-space:pre-line;border-radius:0 8px 8px 0}
h3.sec{margin-top:18px}
</style>
</head><body>
<div class="wrap wide" id="app"></div>
<script src="../config.js"></script>
<script>
const C = window.F27_CONFIG, $app = document.getElementById('app');
const ITENS = [
  'Objetivos e critérios claros',
  'Aulas organizadas e conteúdo claro',
  'Metodologias ajudaram a aprender',
  'Domínio do conteúdo e relação com a prática',
  'À vontade para perguntar e participar',
  'Avaliações coerentes com o trabalhado',
  'Feedback útil sobre o desempenho',
  'Pontual, respeitoso e cumpriu o combinado'
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let senha = null; try { senha = sessionStorage.getItem('aval_pw'); } catch(e){}
let data = null, err = '';
async function load(){
  err = '';
  try {
    const r = await fetch(C.SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/rpc/aval_csas_resultados', {
      method:'POST',
      headers:{'Content-Type':'application/json', apikey:C.SUPABASE_KEY, Authorization:'Bearer '+C.SUPABASE_KEY},
      body: JSON.stringify({p_senha: senha})
    });
    if (!r.ok) throw new Error(r.status === 400 ? 'Senha inválida.' : 'Erro ' + r.status);
    data = await r.json();
    try { sessionStorage.setItem('aval_pw', senha); } catch(e){}
  } catch(e) { data = null; err = e.message; try { sessionStorage.removeItem('aval_pw'); } catch(_){} }
  render();
}
function login(){
  $app.innerHTML = `<div class="hd">Resultados · CSAS</div><div class="card"><h2>Acesso do professor</h2>
    <input type="password" id="pw" placeholder="Senha" autocomplete="off">
    ${err?`<p class="err">${esc(err)}</p>`:''}
    <p><button class="btn full" id="go">Entrar</button></p></div>`;
  const go = () => { senha = document.getElementById('pw').value; load(); };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function lista(arr, k){
  const xs = arr.map(r => r[k]).filter(Boolean);
  return xs.length ? xs.map(x => `<div class="resp">${esc(x)}</div>`).join('') : '<p class="mut small">Sem respostas.</p>';
}
function render(){
  if (!data) return login();
  const D = data.disciplina, P = data.docente;
  const medias = ITENS.map((t,i) => {
    const vs = P.map(r => r['q'+(i+1)]).filter(v => v != null);
    const n = vs.length, m = n ? vs.reduce((a,b)=>a+b,0)/n : null;
    const dist = [1,2,3,4,5].map(v => vs.filter(x => x === v).length);
    return {t,n,m,dist};
  });
  const geral = (() => { const all = medias.filter(x => x.m != null); return all.length ? all.reduce((a,b)=>a+b.m,0)/all.length : null; })();
  $app.innerHTML = `<div class="hd">Resultados · CSAS</div>
  <div class="card"><b>${D.length}</b> respostas na disciplina · <b>${P.length}</b> respostas sobre o professor
    · <button class="btn sec" id="rf" style="padding:6px 12px">Atualizar</button>
    <button class="btn sec" id="csv" style="padding:6px 12px">Baixar CSV</button></div>
  <h2>Módulo 1 · Disciplina</h2>
  <div class="card"><h3 class="sec" style="margin-top:0">Que bom</h3>${lista(D,'bom')}
    <h3 class="sec">Que pena</h3>${lista(D,'pena')}
    <h3 class="sec">Que tal</h3>${lista(D,'que_tal')}
    <h3 class="sec">O que eu levo</h3>${lista(D,'levo')}</div>
  <h2>Módulo 2 · Professor</h2>
  <div class="card">
    ${geral!=null?`<p class="mut">Média geral dos itens: <b>${geral.toFixed(2)}</b> (escala 1 a 5)</p>`:''}
    ${medias.map((x,i)=>`<div class="it"><div><b>${i+1}.</b> ${esc(x.t)} <span class="badge">n=${x.n}</span>
      <div class="dist">${x.dist.map((c,j)=>`<i title="nota ${j+1}: ${c}" style="flex:${Math.max(c,0.0001)}"></i>`).join('')}</div>
      <div class="mut small">1: ${x.dist[0]} · 2: ${x.dist[1]} · 3: ${x.dist[2]} · 4: ${x.dist[3]} · 5: ${x.dist[4]}</div></div>
      <div class="avg">${x.m!=null?x.m.toFixed(1):'–'}</div></div>`).join('')}
    <h3 class="sec">Continuar fazendo</h3>${lista(P,'continuar')}
    <h3 class="sec">Parar ou mudar</h3>${lista(P,'mudar')}
    <h3 class="sec">Conselho para a próxima turma</h3>${lista(P,'conselho')}</div>`;
  document.getElementById('rf').onclick = load;
  document.getElementById('csv').onclick = () => {
    const q = s => '"' + String(s ?? '').replace(/"/g,'""') + '"';
    let out = 'modulo;campo;valor\n';
    D.forEach(r => ['bom','pena','que_tal','levo'].forEach(k => { if (r[k]) out += ['disciplina',k,q(r[k])].join(';') + '\n'; }));
    P.forEach(r => { for (let i=1;i<=8;i++) if (r['q'+i]!=null) out += ['docente','q'+i,r['q'+i]].join(';')+'\n';
      ['continuar','mudar','conselho'].forEach(k => { if (r[k]) out += ['docente',k,q(r[k])].join(';')+'\n'; }); });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+out],{type:'text/csv;charset=utf-8'}));
    a.download = 'avaliacao_csas.csv'; a.click();
  };
}
if (senha) load(); else login();
</script>
</body></html>
